<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Идеи — Путь Художника</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="brand-mark">A</div><span>Путь Художника</span></div>
</div>

<nav class="sidebar">
  <a href="index.html"><span class="icon icon-home"></span> Дашборд</a>
  <a href="learn.html"><span class="icon icon-book"></span> Обучение</a>
  <a href="tasks.html"><span class="icon icon-task"></span> Задачи</a>
  <a href="gallery.html"><span class="icon icon-image"></span> Галерея</a>
  <a href="styles.html"><span class="icon icon-palette"></span> Стили</a>
  <a href="ideas.html"><span class="icon icon-bulb"></span> Идеи</a>
  <a href="settings.html"><span class="icon icon-settings"></span> Профиль</a>
</nav>

<div class="main-wrap">
  <div class="content">
    <h1>Идеи от скуки</h1>
    <p class="sub">Случайная игра + стиль.</p>
    
    <div class="card" style="text-align:center; padding:40px 20px;">
      <div id="ideaIcon" style="font-size:50px; margin-bottom:16px;">🎲</div>
      <h2 id="ideaTitle" style="font-size:20px; margin-bottom:8px;">Нажми кнопку</h2>
      <p id="ideaDesc" style="color:var(--muted); margin-bottom:24px;"></p>
      <button class="btn btn-primary btn-block" onclick="rollIdea()">Сгенерировать идею</button>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html"><span class="icon icon-home"></span>Главная</a>
  <a href="learn.html"><span class="icon icon-book"></span>Уроки</a>
  <a href="tasks.html"><span class="icon icon-task"></span>Задачи</a>
  <a href="gallery.html"><span class="icon icon-image"></span>Галерея</a>
  <a href="settings.html"><span class="icon icon-settings"></span>Профиль</a>
</nav>

<script src="js/data.js"></script>
<script src="js/themes.js"></script>
<script src="js/app.js"></script>
<script>
function onReady() {
  rollIdea(); // Сразу показываем первую идею
}

window.rollIdea = function() {
  const pool = APP_DATA.CREATIVE_TASKS;
  const random = pool[Math.floor(Math.random() * pool.length)];
  
  document.getElementById('ideaTitle').textContent = random.title;
  document.getElementById('ideaDesc').innerHTML = `
    Игра: <b>${random.game}</b><br>
    ${random.desc || ''}
  `;
  document.getElementById('ideaIcon').textContent = '🎨';
};

APP.boot();
</script>
</body>
</html>
