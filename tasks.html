<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Задачи — Путь Художника</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="brand-mark">A</div><span>Путь Художника</span></div>
</div>

<nav class="sidebar">
  <a href="index.html"><span class="icon icon-home"></span> Дашборд</a>
  <a href="learn.html"><span class="icon icon-book"></span> Обучение</a>
  <a href="tasks.html"><span class="icon icon-task"></span> Задачи</a>
  <a href="gallery.html"><span class="icon icon-image"></span> Галерея</a>
  <a href="styles.html"><span class="icon icon-palette"></span> Стили</a>
  <a href="ideas.html"><span class="icon icon-bulb"></span> Идеи</a>
  <a href="settings.html"><span class="icon icon-settings"></span> Настройки</a>
</nav>

<div class="main-wrap">
  <div class="content">
    <h1>Задачи</h1>
    <p class="sub">Учебные — по урокам. Творческие — идеи от скуки с указанием стиля и игры.</p>

    <div class="task-filters">
      <button class="filter-chip active" data-type="all">Все</button>
      <button class="filter-chip" data-type="lesson">Учебные</button>
      <button class="filter-chip" data-type="creative">Творческие</button>
      <button class="filter-chip" data-type="done">Выполненные</button>
    </div>

    <div class="task-filters" id="gameFilters" style="display:none"></div>

    <div id="tasksWrap"></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html"><span class="icon icon-home"></span>Главная</a>
  <a href="learn.html"><span class="icon icon-book"></span>Уроки</a>
  <a href="tasks.html"><span class="icon icon-task"></span>Задачи</a>
  <a href="gallery.html"><span class="icon icon-image"></span>Галерея</a>
  <a href="settings.html"><span class="icon icon-settings"></span>Ещё</a>
</nav>

<script src="js/data.js"></script>
<script src="js/themes.js"></script>
<script src="js/app.js"></script>
<script>
let currentFilter = 'all';
let currentGame = 'all';

const GAMES_LIST = ['Roblox','Doors','Pressure','Hollow Knight','Silksong','Undertale','Deltarune','OneShot','Ultrakill'];

const DIFF_LABEL = { low:'лёгкая', medium:'средняя', high:'сложная' };

function onReady(){
  renderGameFilters();
  renderTasks();
}

function renderGameFilters(){
  const wrap = document.getElementById('gameFilters');
  wrap.innerHTML = `<button class="filter-chip ${currentGame==='all'?'active':''}" data-game="all">Все игры</button>` +
    GAMES_LIST.map(g=>`<button class="filter-chip ${currentGame===g?'active':''}" data-game="${g}">${g}</button>`).join('');
  wrap.querySelectorAll('.filter-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentGame = btn.dataset.game;
      renderGameFilters();
      renderTasks();
    });
  });
}

function getLessonTaskData(taskId){
  const t = APP_DATA.LESSON_TASKS[taskId];
  if(!t) return null;
  const lesson = APP_DATA.PROGRAM.flatMap(l=>l.lessons).find(l=>l.id === t.lesson);
  return { ...t, id: taskId, lessonTitle: lesson ? lesson.title : '' };
}

function renderTasks(){
  const wrap = document.getElementById('tasksWrap');
  let items = [];

  // учебные
  if(currentFilter === 'all' || currentFilter === 'lesson'){
    Object.keys(APP_DATA.LESSON_TASKS).forEach(id=>{
      const t = getLessonTaskData(id);
      if(!t) return;
      if(currentGame !== 'all') return; // учебные не фильтруем по игре
      items.push({ ...t, type:'lesson', taskId:id });
    });
  }

  // творческие
  if(currentFilter === 'all' || currentFilter === 'creative'){
    APP_DATA.CREATIVE_TASKS.forEach(t=>{
      if(currentGame !== 'all' && t.game !== currentGame) return;
      items.push({ ...t, type:'creative' });
    });
  }

  // выполненные
  if(currentFilter === 'done'){
    Object.keys(APP.state.tasks).forEach(id=>{
      if(APP.state.tasks[id] !== 'done') return;
      if(APP_DATA.LESSON_TASKS[id]){
        const t = getLessonTaskData(id);
        if(t) items.push({ ...t, type:'lesson', taskId:id });
      } else {
        const t = APP_DATA.CREATIVE_TASKS.find(x=>x.id === id);
        if(t) items.push({ ...t, type:'creative' });
      }
    });
  }

  if(!items.length){
    wrap.innerHTML = `<div class="empty"><h3>Нет задач</h3><p>Попробуй другой фильтр</p></div>`;
    return;
  }

  wrap.innerHTML = items.map(t=>{
    const done = APP.isTaskDone(t.taskId || t.id);
    const styleName = t.style ? (APP_DATA.STYLES.find(s=>s.id===t.style)?.title || t.style) : '';
    const diff = t.difficulty ? DIFF_LABEL[t.difficulty] : '';
    const diffClass = t.difficulty ? `diff-${t.difficulty}` : '';
    return `
      <div class="task ${done?'done':''}" data-task="${t.taskId || t.id}">
        <button class="task-check">${done?'&#10003;':''}</button>
        <div class="task-body">
          <h4>${t.title}</h4>
          <div class="task-tags">
            ${t.type === 'lesson'
              ? `<span class="tag">Учебная</span>`
              : `<span class="tag">Творческая</span>`}
            ${t.game && t.type === 'creative' ? `<span class="tag">${t.game}</span>` : ''}
            ${styleName ? `<span class="tag">${styleName}</span>` : ''}
            ${diff ? `<span class="tag ${diffClass}">${diff}</span>` : ''}
          </div>
          <p>${t.desc}</p>
        </div>
      </div>
    `;
  }).join('');

  wrap.querySelectorAll('.task-check').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const id = btn.closest('.task').dataset.task;
      APP.toggleTask(id);
      renderTasks();
    });
  });
}

document.addEventListener('click', e=>{
  const chip = e.target.closest('.filter-chip');
  if(!chip || !chip.dataset.type) return;
  currentFilter = chip.dataset.type;
  document.querySelectorAll('.task-filters:first-of-type .filter-chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  document.getElementById('gameFilters').style.display =
    (currentFilter === 'creative' || currentFilter === 'all') ? 'flex' : 'none';
  renderTasks();
});

APP.boot();
</script>
</body>
</html>
