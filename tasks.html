<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Задачи — Путь Художника</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="brand-mark">A</div><span>Путь Художника</span></div>
</div>

<nav class="sidebar">
  <a href="index.html"><span class="icon icon-home"></span> Дашборд</a>
  <a href="learn.html"><span class="icon icon-book"></span> Обучение</a>
  <a href="tasks.html"><span class="icon icon-task"></span> Задачи</a>
  <a href="gallery.html"><span class="icon icon-image"></span> Галерея</a>
  <a href="styles.html"><span class="icon icon-palette"></span> Стили</a>
  <a href="ideas.html"><span class="icon icon-bulb"></span> Идеи</a>
  <a href="settings.html"><span class="icon icon-settings"></span> Профиль</a>
</nav>

<div class="main-wrap">
  <div class="content">
    <h1>Задачи</h1>
    <p class="sub">Выполняй задачи, получай XP.</p>

    <div class="task-filters" id="filterTabs">
      <button class="filter-chip active" data-filter="all">Все</button>
      <button class="filter-chip" data-filter="lesson">Учебные</button>
      <button class="filter-chip" data-filter="creative">Творческие</button>
    </div>

    <div id="tasksWrap"></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html"><span class="icon icon-home"></span>Главная</a>
  <a href="learn.html"><span class="icon icon-book"></span>Уроки</a>
  <a href="tasks.html"><span class="icon icon-task"></span>Задачи</a>
  <a href="gallery.html"><span class="icon icon-image"></span>Галерея</a>
  <a href="settings.html"><span class="icon icon-settings"></span>Профиль</a>
</nav>

<script src="js/data.js"></script>
<script src="js/themes.js"></script>
<script src="js/app.js"></script>
<script>
let currentFilter = 'all';

function onReady(){
  bindEvents();
  renderTasks();
}

function bindEvents(){
  document.getElementById('filterTabs').onclick = e => {
    const chip = e.target.closest('.filter-chip');
    if(!chip) return;
    currentFilter = chip.dataset.filter;
    document.querySelectorAll('#filterTabs .filter-chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    renderTasks();
  };
}

function renderTasks(){
  const wrap = document.getElementById('tasksWrap');
  let items = [];

  // Собираем задачи
  if(currentFilter === 'all' || currentFilter === 'lesson'){
    Object.keys(APP_DATA.LESSON_TASKS).forEach(id => {
      items.push({ ...APP_DATA.LESSON_TASKS[id], id, type: 'lesson' });
    });
  }
  if(currentFilter === 'all' || currentFilter === 'creative'){
    APP_DATA.CREATIVE_TASKS.forEach(t => {
      items.push({ ...t, type: 'creative' });
    });
  }

  if(!items.length){
    wrap.innerHTML = '<div class="empty"><h3>Нет задач</h3></div>';
    return;
  }

  wrap.innerHTML = items.map(t => {
    const isDone = APP.isTaskDone(t.id);
    return `
      <div class="task ${isDone?'done':''}" onclick="toggleTask('${t.id}')">
        <button class="task-check">${isDone?'✓':''}</button>
        <div class="task-body">
          <h4>${t.title}</h4>
          <div class="task-tags">
            <span class="tag">${t.type === 'lesson' ? 'Учебная' : 'Творческая'}</span>
            ${t.game ? `<span class="tag">${t.game}</span>` : ''}
          </div>
          <p>${t.desc || ''}</p>
        </div>
      </div>
    `;
  }).join('');
}

window.toggleTask = function(id) {
  APP.toggleTask(id);
  renderTasks(); // Обновляем список
};

APP.boot();
</script>
</body>
</html>
