<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обучение — Путь Художника</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="brand-mark">A</div><span>Путь Художника</span></div>
</div>

<nav class="sidebar">
  <a href="index.html"><span class="icon icon-home"></span> Дашборд</a>
  <a href="learn.html"><span class="icon icon-book"></span> Обучение</a>
  <a href="tasks.html"><span class="icon icon-task"></span> Задачи</a>
  <a href="gallery.html"><span class="icon icon-image"></span> Галерея</a>
  <a href="styles.html"><span class="icon icon-palette"></span> Стили</a>
  <a href="ideas.html"><span class="icon icon-bulb"></span> Идеи</a>
  <a href="settings.html"><span class="icon icon-settings"></span> Профиль</a>
</nav>

<div class="main-wrap">
  <div class="content">
    <h1>Обучение</h1>
    <p class="sub">5 уровней, 20 уроков. Не перескакивай.</p>
    <div id="levelsWrap"></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html"><span class="icon icon-home"></span>Главная</a>
  <a href="learn.html"><span class="icon icon-book"></span>Уроки</a>
  <a href="tasks.html"><span class="icon icon-task"></span>Задачи</a>
  <a href="gallery.html"><span class="icon icon-image"></span>Галерея</a>
  <a href="settings.html"><span class="icon icon-settings"></span>Профиль</a>
</nav>

<script src="js/data.js"></script>
<script src="js/themes.js"></script>
<script src="js/app.js"></script>
<script>
function onReady(){
  renderLevels();
}

function renderLevels(){
  const wrap = document.getElementById('levelsWrap');
  wrap.innerHTML = APP_DATA.PROGRAM.map(level => {
    const done = level.lessons.filter(l => APP.state.progress[l.id]).length;
    const total = level.lessons.length;
    const allDone = done === total;

    return `
      <div class="level-card">
        <div class="level-head">
          <div class="level-num ${allDone?'done':''}">${allDone?'✓':level.id}</div>
          <div class="level-title">
            <h3>${level.title}</h3>
            <p>${done} / ${total} уроков</p>
          </div>
        </div>
        <div class="level-body open">
          ${level.lessons.map(lesson => {
            const isDone = !!APP.state.progress[lesson.id];
            return `
              <div class="lesson ${isDone?'done':''}" onclick="toggleLesson('${lesson.id}')">
                <button class="lesson-check">${isDone?'✓':''}</button>
                <div class="lesson-body">
                  <h4>${lesson.title}</h4>
                  <div class="games">${lesson.games}</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }).join('');
}

window.toggleLesson = function(id) {
  APP.toggleLesson(id);
  renderLevels(); // Перерисовываем, чтобы галочка обновилась
};

APP.boot();
</script>
</body>
</html>
