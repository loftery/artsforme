<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Стили — Путь Художника</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="brand-mark">A</div><span>Путь Художника</span></div>
</div>
<nav class="sidebar">
  <a href="index.html"><span class="icon icon-home"></span> Дашборд</a>
  <a href="learn.html"><span class="icon icon-book"></span> Обучение</a>
  <a href="tasks.html"><span class="icon icon-task"></span> Задачи</a>
  <a href="gallery.html"><span class="icon icon-image"></span> Галерея</a>
  <a href="styles.html"><span class="icon icon-palette"></span> Стили</a>
  <a href="ideas.html"><span class="icon icon-bulb"></span> Идеи</a>
  <a href="settings.html"><span class="icon icon-settings"></span> Настройки</a>
</nav>
<div class="main-wrap">
  <div class="content">
    <h1>Стили</h1>
    <p class="sub">10 стилей. Что это, где встречается, что рисовать.</p>
    <div id="stylesWrap" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:16px;"></div>
  </div>
</div>
<nav class="bottom-nav">
  <a href="index.html"><span class="icon icon-home"></span>Главная</a>
  <a href="learn.html"><span class="icon icon-book"></span>Уроки</a>
  <a href="tasks.html"><span class="icon icon-task"></span>Задачи</a>
  <a href="gallery.html"><span class="icon icon-image"></span>Галерея</a>
  <a href="settings.html"><span class="icon icon-settings"></span>Ещё</a>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/data.js"></script>
<script src="js/themes.js"></script>
<script src="js/app.js"></script>
<script>
function onReady(){
  const wrap = document.getElementById('stylesWrap');
  if(!wrap) return;
  wrap.innerHTML = APP_DATA.STYLES.map(s=>`
    <div class="card" style="margin:0; padding:20px; background:var(--card); border:2px solid var(--line); border-radius:14px;">
      <h3 style="margin-top:0; margin-bottom:10px; font-size:17px; color:var(--accent);">${s.title}</h3>
      <p style="font-size:14px; margin:0 0 12px; line-height:1.5; color:var(--text);">${s.desc}</p>
      <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;">
        ${s.games.map(g=>`<span style="font-size:10px; font-weight:700; padding:3px 8px; border-radius:6px; background:rgba(200,85,61,.12); color:var(--accent);">${g}</span>`).join('')}
      </div>
      <p style="font-size:12px; color:var(--muted); margin:0; line-height:1.4;">
        <strong>Совет:</strong> ${s.tips}
      </p>
    </div>
  `).join('');
}
APP.boot();
</script>
</body>
</html>
