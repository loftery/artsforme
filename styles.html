<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Стили — Путь Художника</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="brand-mark">A</div><span>Путь Художника</span></div>
</div>

<nav class="sidebar">
  <a href="index.html"><span class="icon icon-home"></span> Дашборд</a>
  <a href="learn.html"><span class="icon icon-book"></span> Обучение</a>
  <a href="tasks.html"><span class="icon icon-task"></span> Задачи</a>
  <a href="gallery.html"><span class="icon icon-image"></span> Галерея</a>
  <a href="styles.html"><span class="icon icon-palette"></span> Стили</a>
  <a href="ideas.html"><span class="icon icon-bulb"></span> Идеи</a>
  <a href="settings.html"><span class="icon icon-settings"></span> Настройки</a>
</nav>

<div class="main-wrap">
  <div class="content">
    <h1>Стили</h1>
    <p class="sub">10 стилей. Что это и где встречается.</p>
    <div id="stylesWrap" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:16px;"></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html"><span class="icon icon-home"></span>Главная</a>
  <a href="learn.html"><span class="icon icon-book"></span>Уроки</a>
  <a href="tasks.html"><span class="icon icon-task"></span>Задачи</a>
  <a href="gallery.html"><span class="icon icon-image"></span>Галерея</a>
  <a href="settings.html"><span class="icon icon-settings"></span>Ещё</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/data.js"></script>
<script src="js/themes.js"></script>
<script src="js/app.js"></script>
<script>
function onReady(){
  const wrap = document.getElementById('stylesWrap');
  wrap.innerHTML = APP_DATA.STYLES.map(s=>`
    <div class="card">
      <h3 style="color:var(--accent);">${s.title}</h3>
      <p style="font-size:14px;">${s.desc}</p>
      <span class="tag">${s.games}</span>
    </div>
  `).join('');
}
APP.boot();
</script>
</body>
</html>
