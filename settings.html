<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Стили — Путь Художника</title>
<style>
  /* ВСТРОЕННЫЕ СТИЛИ (без папок) */
  *{box-sizing:border-box}
  body{margin:0; background:#faf8f4; color:#2a2520; font-family:sans-serif; padding:20px;}
  h1{font-size:24px}
  .card{background:#fff; border:2px solid #e8e0d5; border-radius:14px; padding:20px; margin-bottom:16px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px;}
  .tag{font-size:10px; font-weight:700; padding:3px 8px; border-radius:6px; background:rgba(200,85,61,.12); color:#c8553d; margin-right:6px;}
  nav {margin-bottom: 20px; display: flex; gap: 10px;}
  nav a {color: #c8553d; text-decoration: none; font-weight: bold;}
</style>
</head>
<body>

<nav>
  <a href="index.html">Главная</a> | 
  <a href="styles.html">Стили</a> | 
  <a href="settings.html">Настройки</a>
</nav>

<h1>Стили</h1>
<p>10 стилей. Что это, где встречается, что рисовать.</p>

<div class="grid" id="stylesWrap"></div>

<script>
  // ВСТРОЕННЫЕ ДАННЫЕ (без папки js)
  const STYLES = [
    { title:"Реализм", desc:"Точные пропорции, свет, тени. База для всего.", games:["—"], tips:"Начинай с формы, не с деталей." },
    { title:"Скетч", desc:"Быстрые линии, штриховка. Ловит движение, а не детали.", games:["Hollow Knight"], tips:"30 секунд на позу. Не исправляй." },
    { title:"Комикс", desc:"Толстый контур, штриховка, динамика.", games:["Ultrakill","Pressure"], tips:"Контур должен читаться без цвета." },
    { title:"Мультяшный", desc:"Упрощённые формы, яркие цвета.", games:["Roblox","Deltarune"], tips:"Форма важнее текстуры." },
    { title:"Пиксель-арт", desc:"Сетка, ограниченная палитра. 1 пиксель = 1 клетка.", games:["Undertale","OneShot"], tips:"Никакого сглаживания." },
    { title:"Аниме", desc:"Большие глаза, линии, тени.", games:["Silksong"], tips:"Глаза — главное. Но форма головы важнее." },
    { title:"Минимализм", desc:"Мало деталей, сила силуэта.", games:["OneShot","Hollow Knight"], tips:"Убери всё, что можно убрать." },
    { title:"Готика", desc:"Мрачно, изящно, контраст.", games:["Hollow Knight","Silksong"], tips:"Тонкие линии, тёмные тени." },
    { title:"Гранж", desc:"Грязно, жёстко, текстуры.", games:["Ultrakill","Pressure"], tips:"Не бойся грязи." },
    { title:"Плоский", desc:"Без объёма, чистые цвета.", games:["Roblox","Deltarune"], tips:"Никаких градиентов." }
  ];

  // ВСТРОЕННЫЙ СКРИПТ (без папки js)
  const wrap = document.getElementById('stylesWrap');
  wrap.innerHTML = STYLES.map(s => `
    <div class="card">
      <h3 style="margin-top:0; color:#c8553d;">${s.title}</h3>
      <p style="font-size:14px; margin-bottom:12px;">${s.desc}</p>
      <div style="margin-bottom:12px;">
        ${s.games.map(g => `<span class="tag">${g}</span>`).join('')}
      </div>
      <p style="font-size:12px; color:#8a7f72;"><strong>Совет:</strong> ${s.tips}</p>
    </div>
  `).join('');
</script>

</body>
</html>
