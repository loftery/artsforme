<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Настройки — Путь Художника</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="brand-mark">A</div><span>Путь Художника</span></div>
</div>

<nav class="sidebar">
  <a href="index.html"><span class="icon icon-home"></span> Дашборд</a>
  <a href="learn.html"><span class="icon icon-book"></span> Обучение</a>
  <a href="tasks.html"><span class="icon icon-task"></span> Задачи</a>
  <a href="gallery.html"><span class="icon icon-image"></span> Галерея</a>
  <a href="styles.html"><span class="icon icon-palette"></span> Стили</a>
  <a href="ideas.html"><span class="icon icon-bulb"></span> Идеи</a>
  <a href="settings.html"><span class="icon icon-settings"></span> Настройки</a>
</nav>

<div class="main-wrap">
  <div class="content">
    <h1>Настройки</h1>
    
    <div class="card">
      <h3>Тема</h3>
      <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; margin-top:12px;" id="themeGrid"></div>
    </div>

    <div class="card">
      <h3>Синхронизация</h3>
      <div class="field">
        <label>Supabase URL</label>
        <input type="text" id="sbUrl" placeholder="https://xxxx.supabase.co">
      </div>
      <div class="field">
        <label>Supabase anon key</label>
        <input type="text" id="sbKey" placeholder="eyJhbGci...">
      </div>
      <button class="btn btn-primary btn-block" id="sbSave">Подключить</button>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html"><span class="icon icon-home"></span>Главная</a>
  <a href="learn.html"><span class="icon icon-book"></span>Уроки</a>
  <a href="tasks.html"><span class="icon icon-task"></span>Задачи</a>
  <a href="gallery.html"><span class="icon icon-image"></span>Галерея</a>
  <a href="settings.html"><span class="icon icon-settings"></span>Ещё</a>
</nav>

<script src="js/data.js"></script>
<script src="js/themes.js"></script>
<script>
// ============================================
// ВШИТЫЙ ЛОКАЛЬНЫЙ КОД (чтобы не зависеть от app.js)
// ============================================
const store = {
  get(key, def){ try{ return JSON.parse(localStorage.getItem('ap_'+key)) ?? def; }catch{ return def; } },
  set(key, val){ localStorage.setItem('ap_'+key, JSON.stringify(val)); }
};

function applyTheme(id) {
  // Меняем тему
  document.body.dataset.theme = id;
  localStorage.setItem('artist_theme', id);
  
  // Перерисовываем кнопки
  const grid = document.getElementById('themeGrid');
  const current = id;
  
  grid.innerHTML = Object.entries(APP_THEMES.THEMES).map(([tId,t])=>`
    <button class="btn ${tId===current?'btn-primary':'btn-ghost'}" onclick="applyTheme('${tId}')">${t.name}</button>
  `).join('');
}

// Инициализация при загрузке
function init() {
  // 1. Восстанавливаем тему
  const savedTheme = localStorage.getItem('artist_theme') || 'default';
  document.body.dataset.theme = savedTheme;
  if (window.APP_THEMES) {
    APP_THEMES.applyTheme(savedTheme);
  }
  applyTheme(savedTheme);

  // 2. Загружаем ключи Supabase
  const cfg = store.get('supabase', null);
  if(cfg) {
    document.getElementById('sbUrl').value = cfg.url || '';
    document.getElementById('sbKey').value = cfg.key || '';
  }

  // 3. Кнопка сохранения
  document.getElementById('sbSave').addEventListener('click', ()=>{
    const url = document.getElementById('sbUrl').value.trim();
    const key = document.getElementById('sbKey').value.trim();
    if(!url || !key) return alert('Заполни поля');
    store.set('supabase', {url, key});
    alert('Сохранено! Перезагрузи страницу.');
  });
}

// Запускаем всё это сразу, как только страница загрузилась
window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
