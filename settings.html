<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Настройки — Путь Художника</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="brand-mark">A</div><span>Путь Художника</span></div>
</div>

<nav class="sidebar">
  <a href="index.html"><span class="icon icon-home"></span> Дашборд</a>
  <a href="learn.html"><span class="icon icon-book"></span> Обучение</a>
  <a href="tasks.html"><span class="icon icon-task"></span> Задачи</a>
  <a href="gallery.html"><span class="icon icon-image"></span> Галерея</a>
  <a href="styles.html"><span class="icon icon-palette"></span> Стили</a>
  <a href="ideas.html"><span class="icon icon-bulb"></span> Идеи</a>
  <a href="settings.html"><span class="icon icon-settings"></span> Настройки</a>
</nav>

<div class="main-wrap">
  <div class="content">
    <h1>Настройки</h1>
    
    <div class="card">
      <h3>Тема</h3>
      <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; margin-top:12px;" id="themeGrid"></div>
    </div>

    <div class="card">
      <h3>Сброс</h3>
      <p style="font-size:13px; color:var(--muted); margin-bottom:10px;">Удаляет весь прогресс и настройки. Рисунки останутся.</p>
      <button class="btn btn-ghost btn-block" id="resetBtn" style="color:red; border-color:red;">Сбросить прогресс</button>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html"><span class="icon icon-home"></span>Главная</a>
  <a href="learn.html"><span class="icon icon-book"></span>Уроки</a>
  <a href="tasks.html"><span class="icon icon-task"></span>Задачи</a>
  <a href="gallery.html"><span class="icon icon-image"></span>Галерея</a>
  <a href="settings.html"><span class="icon icon-settings"></span>Ещё</a>
</nav>

<script src="js/data.js"></script>
<script src="js/themes.js"></script>
<script src="js/app.js"></script>
<script>
function onReady(){
  renderThemes();
  
  document.getElementById('resetBtn').onclick = () => {
    if(!confirm('Сбросить весь прогресс?')) return;
    localStorage.removeItem('ap_progress');
    localStorage.removeItem('ap_tasks');
    localStorage.removeItem('ap_xp');
    localStorage.removeItem('ap_streak');
    location.reload();
  };
}

function renderThemes(){
  const grid = document.getElementById('themeGrid');
  const current = APP.state.theme;
  
  grid.innerHTML = Object.entries(APP_THEMES.THEMES).map(([id,t])=>`
    <button class="btn ${id===current?'btn-primary':'btn-ghost'}" onclick="changeTheme('${id}')">${t.name}</button>
  `).join('');
}

window.changeTheme = function(id) {
  APP.state.theme = id;
  APP_THEMES.applyTheme(id);
  localStorage.setItem('artist_theme', id);
  renderThemes();
};

APP.boot();
</script>
</body>
</html>
