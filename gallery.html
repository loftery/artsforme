<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Галерея — Путь Художника</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="brand-mark">A</div><span>Путь Художника</span></div>
  <button class="btn btn-primary" id="addBtn">+ Добавить</button>
</div>

<nav class="sidebar" aria-label="Основная навигация">
  <a href="index.html"><span class="icon icon-home" aria-hidden="true"></span>Дашборд</a>
  <a href="learn.html"><span class="icon icon-book" aria-hidden="true"></span>Обучение</a>
  <a href="tasks.html"><span class="icon icon-task" aria-hidden="true"></span>Задачи</a>
  <a href="gallery.html" class="active"><span class="icon icon-image" aria-hidden="true"></span>Галерея</a>
  <a href="styles.html"><span class="icon icon-palette" aria-hidden="true"></span>Стили</a>
  <a href="ideas.html"><span class="icon icon-bulb" aria-hidden="true"></span>Идеи</a>
  <a href="settings.html"><span class="icon icon-settings" aria-hidden="true"></span>Настройки</a>
</nav>

<div class="main-wrap">
  <div class="content">
    <h1>Галерея</h1>
    <p class="sub">Твои рисунки.</p>

    <div class="task-filters" id="catTabs">
      <button class="filter-chip active" data-cat="all">Все</button>
      <button class="filter-chip" data-cat="hand">От руки</button>
      <button class="filter-chip" data-cat="ibis">Ibis</button>
      <button class="filter-chip" data-cat="krita">Krita</button>
    </div>

    <div id="galleryWrap" class="gallery-grid"></div>
    <div id="emptyWrap" class="empty" style="display:none">
      <h3>Пока пусто</h3>
      <p>Нажми «+ Добавить»</p>
    </div>
  </div>
</div>

<nav class="bottom-nav" aria-label="Быстрая навигация">
  <a href="index.html"><span class="icon icon-home" aria-hidden="true"></span><span>Главная</span></a>
  <a href="learn.html"><span class="icon icon-book" aria-hidden="true"></span><span>Уроки</span></a>
  <a href="tasks.html"><span class="icon icon-task" aria-hidden="true"></span><span>Задачи</span></a>
  <a href="gallery.html" class="active"><span class="icon icon-image" aria-hidden="true"></span><span>Галерея</span></a>
  <a href="settings.html"><span class="icon icon-settings" aria-hidden="true"></span><span>Профиль</span></a>
</nav>

<!-- Модалка добавления -->
<div class="modal-bg" id="addModal">
  <div class="modal">
    <h2>Добавить рисунок</h2>
    <div class="field">
      <label>Файл</label>
      <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif">
    </div>
    <div id="preview" style="margin-bottom:14px"></div>
    <div class="field">
      <label>Название</label>
      <input type="text" id="titleInput" placeholder="Имя рисунка">
    </div>
    <div class="field">
      <label>Категория</label>
      <select id="catSelect">
        <option value="hand">От руки</option>
        <option value="ibis">Ibis Paint</option>
        <option value="krita">Krita</option>
      </select>
    </div>
    <div class="field">
      <label>Заметка</label>
      <textarea id="notesInput" placeholder="Что получилось..."></textarea>
    </div>
    <div style="display:flex; gap:8px; margin-top:20px;">
      <button class="btn btn-ghost btn-block" id="cancelBtn">Отмена</button>
      <button class="btn btn-primary btn-block" id="saveBtn">Сохранить</button>
    </div>
  </div>
</div>

<!-- Модалка просмотра (ИСПРАВЛЕНА) -->
<div class="modal-bg" id="viewModal">
  <div class="modal" style="max-width:800px; padding:0; overflow:hidden; display:flex; flex-direction:column;">
    <div style="padding:15px 20px; background:var(--card); border-bottom:2px solid var(--line); display:flex; justify-content:space-between; align-items:center;">
      <h2 id="viewTitle" style="margin:0; font-size:18px;">Название</h2>
      <button class="btn btn-ghost" id="closeView" style="padding:6px 12px;">✕ Закрыть</button>
    </div>
    
    <div style="background:#111; display:flex; justify-content:center; align-items:center; min-height:300px; max-height:60vh; padding:10px;">
      <img id="viewImg" style="max-width:100%; max-height:60vh; object-fit:contain; border-radius:4px;" src="" alt="">
    </div>
    
    <div style="padding:20px; background:var(--card);">
      <div style="display:flex; gap:10px; margin-bottom:10px;">
        <span id="viewCat" class="cat-tag" style="font-size:12px; padding:4px 10px;">Ibis</span>
        <span id="viewDate" style="font-size:13px; color:var(--muted); align-self:center;"></span>
      </div>
      <p id="viewInfo" style="font-size:14px; color:var(--text); margin:0; line-height:1.6;"></p>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/themes.js"></script>
<script src="js/app.js"></script>
<script>
let currentCat = 'all';
let pendingFile = null;

function onReady(){
  bindEvents();
  renderGallery();
}

function bindEvents(){
  document.getElementById('addBtn').onclick = () => document.getElementById('addModal').classList.add('show');
  document.getElementById('cancelBtn').onclick = () => document.getElementById('addModal').classList.remove('show');
  document.getElementById('closeView').onclick = () => document.getElementById('viewModal').classList.remove('show');
  
  document.getElementById('fileInput').onchange = e => {
    pendingFile = e.target.files[0];
    if(!pendingFile) return;
    const allowed = ['image/png','image/jpeg','image/webp','image/gif'];
    if(!allowed.includes(pendingFile.type)) { alert('Поддерживаются PNG, JPG, WEBP и GIF.'); e.target.value=''; pendingFile=null; return; }
    if(pendingFile.size > 8 * 1024 * 1024) { alert('Файл слишком большой. Максимальный размер — 8 МБ.'); e.target.value=''; pendingFile=null; return; }
    const r = new FileReader();
    r.onload = ev => {
      document.getElementById('preview').innerHTML = `<img src="${ev.target.result}" style="max-width:100%; max-height:160px; border-radius:8px; object-fit:contain;">`;
    };
    r.readAsDataURL(pendingFile);
  };

  document.getElementById('saveBtn').onclick = saveImage;

  document.getElementById('catTabs').onclick = e => {
    const chip = e.target.closest('.filter-chip');
    if(!chip) return;
    currentCat = chip.dataset.cat;
    document.querySelectorAll('#catTabs .filter-chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    renderGallery();
  };
}

async function saveImage(){
  if(!pendingFile) return alert('Выбери файл');
  const title = document.getElementById('titleInput').value;
  const cat = document.getElementById('catSelect').value;
  const notes = document.getElementById('notesInput').value;

  const reader = new FileReader();
  reader.onload = async ev => {
    const id = 'img_' + Date.now();
    await APP.dbPut({ id, data: ev.target.result });
    APP.addGalleryItem({ id, title: title || 'Без названия', cat, notes, created: Date.now() });
    
    document.getElementById('addModal').classList.remove('show');
    document.getElementById('titleInput').value = '';
    document.getElementById('notesInput').value = '';
    document.getElementById('preview').innerHTML = '';
    document.getElementById('fileInput').value = '';
    pendingFile = null;
    
    renderGallery();
  };
  reader.readAsDataURL(pendingFile);
}

async function renderGallery(){
  const meta = APP.state.meta;
  let items = meta.slice();
  if(currentCat !== 'all') items = items.filter(m=>m.cat === currentCat);
  items.sort((a,b)=>b.created - a.created);

  const wrap = document.getElementById('galleryWrap');
  wrap.replaceChildren();
  document.getElementById('emptyWrap').style.display = items.length ? 'none' : 'block';

  for(const m of items){
    const rec = await APP.dbGet(m.id);
    if (!rec) continue;

    const card = document.createElement('article');
    card.className = 'gallery-card';

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.textContent = '×';
    del.setAttribute('aria-label', 'Удалить рисунок ' + (m.title || 'Без названия'));

    const image = document.createElement('img');
    image.src = rec.data;
    image.alt = m.title || 'Сохранённый рисунок';
    image.loading = 'lazy';
    image.decoding = 'async';

    const info = document.createElement('div');
    info.className = 'meta';
    const category = document.createElement('span');
    category.className = 'cat-tag cat-' + (APP.CAT_LABEL[m.cat] ? m.cat : 'hand');
    category.textContent = APP.CAT_LABEL[m.cat] || 'От руки';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = m.title || 'Без названия';
    info.append(category, name);
    card.append(del, image, info);

    card.addEventListener('click', () => {
      document.getElementById('viewTitle').textContent = m.title || 'Без названия';
      const viewImg = document.getElementById('viewImg');
      viewImg.src = rec.data;
      viewImg.alt = m.title || 'Сохранённый рисунок';
      const catEl = document.getElementById('viewCat');
      catEl.textContent = APP.CAT_LABEL[m.cat] || 'От руки';
      catEl.className = 'cat-tag cat-' + (APP.CAT_LABEL[m.cat] ? m.cat : 'hand');
      document.getElementById('viewDate').textContent = APP.formatDate(m.created);
      document.getElementById('viewInfo').textContent = m.notes || 'Без заметок';
      document.getElementById('viewModal').classList.add('show');
    });

    del.addEventListener('click', async e => {
      e.stopPropagation();
      if(!confirm('Удалить рисунок из галереи?')) return;
      await APP.dbDel(m.id);
      APP.delGalleryItem(m.id);
      await renderGallery();
    });
    wrap.appendChild(card);
  }
}

APP.boot();
</script>
</body>
</html>
