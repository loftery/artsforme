<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Галерея — Путь Художника</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="brand-mark">A</div><span>Путь Художника</span></div>
  <button class="btn btn-primary" id="addBtn">+ Добавить</button>
</div>

<nav class="sidebar">
  <a href="index.html"><span class="icon icon-home"></span> Дашборд</a>
  <a href="learn.html"><span class="icon icon-book"></span> Обучение</a>
  <a href="tasks.html"><span class="icon icon-task"></span> Задачи</a>
  <a href="gallery.html"><span class="icon icon-image"></span> Галерея</a>
  <a href="styles.html"><span class="icon icon-palette"></span> Стили</a>
  <a href="ideas.html"><span class="icon icon-bulb"></span> Идеи</a>
  <a href="settings.html"><span class="icon icon-settings"></span> Настройки</a>
</nav>

<div class="main-wrap">
  <div class="content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <div>
        <h1>Галерея</h1>
        <p class="sub">Твои рисунки.</p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-ghost" id="exportBtn">Скачать</button>
        <button class="btn btn-ghost" id="importBtn">Загрузить</button>
        <input type="file" id="importFile" accept=".json" style="display:none">
      </div>
    </div>

    <div class="task-filters" id="catTabs">
      <button class="filter-chip active" data-cat="all">Все</button>
      <button class="filter-chip" data-cat="hand">От руки</button>
      <button class="filter-chip" data-cat="ibis">Ibis</button>
      <button class="filter-chip" data-cat="krita">Krita</button>
    </div>

    <div id="galleryWrap" class="gallery-grid"></div>
    <div id="emptyWrap" class="empty" style="display:none">
      <h3>Пока пусто</h3>
      <p>Нажми «+ Добавить»</p>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html"><span class="icon icon-home"></span>Главная</a>
  <a href="learn.html"><span class="icon icon-book"></span>Уроки</a>
  <a href="tasks.html"><span class="icon icon-task"></span>Задачи</a>
  <a href="gallery.html"><span class="icon icon-image"></span>Галерея</a>
  <a href="settings.html"><span class="icon icon-settings"></span>Ещё</a>
</nav>

<div class="modal-bg" id="addModal">
  <div class="modal">
    <h2>Добавить рисунок</h2>
    <div class="field"><label>Файл</label><input type="file" id="fileInput" accept="image/*"></div>
    <div id="preview" style="margin-bottom:14px"></div>
    <div class="field"><label>Название</label><input type="text" id="titleInput" placeholder="Имя рисунка"></div>
    <div class="field"><label>Категория</label>
      <select id="catSelect"><option value="hand">От руки</option><option value="ibis">Ibis Paint</option><option value="krita">Krita</option></select>
    </div>
    <div class="field"><label>Заметка</label><textarea id="notesInput" placeholder="Что получилось..."></textarea></div>
    <div style="display:flex; gap:8px">
      <button class="btn btn-ghost btn-block" id="cancelBtn">Отмена</button>
      <button class="btn btn-primary btn-block" id="saveBtn">Сохранить</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="viewModal">
  <div class="modal" style="max-width:700px">
    <h2 id="viewTitle"></h2>
    <img id="viewImg" style="width:100%; border-radius:10px; margin-bottom:12px" src="" alt="">
    <p id="viewInfo" style="font-size:13px; color:var(--muted)"></p>
    <button class="btn btn-ghost btn-block" id="closeView" style="margin-top:12px">Закрыть</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/themes.js"></script>
<script src="js/app.js"></script>
<script>
let currentCat = 'all';
let pendingFile = null;

function onReady(){
  bindEvents();
  renderGallery();
}

function bindEvents(){
  document.getElementById('addBtn').onclick = ()=>document.getElementById('addModal').classList.add('show');
  document.getElementById('cancelBtn').onclick = ()=>document.getElementById('addModal').classList.remove('show');
  document.getElementById('closeView').onclick = ()=>document.getElementById('viewModal').classList.remove('show');
  
  document.getElementById('fileInput').onchange = e => {
    pendingFile = e.target.files[0];
    if(!pendingFile) return;
    const r = new FileReader();
    r.onload = ev => {
      document.getElementById('preview').innerHTML = `<img src="${ev.target.result}" style="max-width:100%; max-height:160px; border-radius:8px">`;
    };
    r.readAsDataURL(pendingFile);
  };

  document.getElementById('saveBtn').onclick = saveImage;

  document.getElementById('catTabs').onclick = e => {
    const chip = e.target.closest('.filter-chip');
    if(!chip) return;
    currentCat = chip.dataset.cat;
    document.querySelectorAll('#catTabs .filter-chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    renderGallery();
  };

  // Экспорт
  document.getElementById('exportBtn').onclick = async () => {
    const images = await APP.dbAll();
    const data = { meta: APP.store.get('meta', []), images };
    const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'gallery-backup.json';
    a.click();
  };

  // Импорт
  document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
  document.getElementById('importFile').onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ev => {
      const data = JSON.parse(ev.target.result);
      if (data.meta) APP.store.set('meta', data.meta);
      if (data.images) {
        for (const img of data.images) await APP.dbPut(img);
      }
      alert('Импорт успешен!');
      renderGallery();
    };
    reader.readAsText(file);
  };
}

async function saveImage(){
  if(!pendingFile) return alert('Выбери файл');
  const title = document.getElementById('titleInput').value;
  const cat = document.getElementById('catSelect').value;
  const notes = document.getElementById('notesInput').value;

  const reader = new FileReader();
  reader.onload = async ev => {
    const id = 'img_' + Date.now();
    await APP.dbPut({ id, data: ev.target.result });
    const meta = APP.store.get('meta', []);
    meta.push({ id, title: title || 'Без названия', cat, notes, created: Date.now() });
    APP.store.set('meta', meta);
    
    document.getElementById('addModal').classList.remove('show');
    document.getElementById('titleInput').value = '';
    document.getElementById('notesInput').value = '';
    pendingFile = null;
    document.getElementById('preview').innerHTML = '';
    renderGallery();
  };
  reader.readAsDataURL(pendingFile);
}

async function renderGallery(){
  const meta = APP.store.get('meta', []);
  let list = meta;
  if(currentCat !== 'all') list = list.filter(m=>m.cat === currentCat);
  list.sort((a,b)=>b.created - a.created);

  const wrap = document.getElementById('galleryWrap');
  wrap.innerHTML = '';
  document.getElementById('emptyWrap').style.display = list.length ? 'none' : 'block';

  for(const m of list){
    const rec = await APP.dbGet(m.id);
    if (!rec) continue;

    const card = document.createElement('div');
    card.className = 'gallery-card';
    card.innerHTML = `
      <button class="del">✕</button>
      <img src="${rec.data}" alt="">
      <div class="meta">
        <span class="cat-tag cat-${m.cat}">${APP.CAT_LABEL[m.cat]}</span>
        <div class="name">${m.title}</div>
      </div>
    `;
    card.onclick = (e) => {
      if(e.target.classList.contains('del')) return;
      document.getElementById('viewTitle').textContent = m.title;
      document.getElementById('viewImg').src = rec.data;
      document.getElementById('viewInfo').textContent = m.notes || '';
      document.getElementById('viewModal').classList.add('show');
    };
    card.querySelector('.del').onclick = async (e) => {
      e.stopPropagation();
      if(!confirm('Удалить?')) return;
      await APP.dbDel(m.id);
      APP.store.set('meta', APP.store.get('meta', []).filter(x=>x.id !== m.id));
      renderGallery();
    };
    wrap.appendChild(card);
  }
}

APP.boot();
</script>
</body>
</html>
